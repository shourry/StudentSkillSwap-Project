<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Skill Mentors | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    
    <!-- Title & Description -->
    <div class="mb-4">
      <div class="d-flex align-items-center gap-2">
        <h2 class="fw-bold mb-0">🔍 Search & Match Peer Mentors</h2>
        <span class="badge bg-primary">Automated Matching</span>
      </div>
      <p class="text-muted small mb-0">Find fellow BIST students who can teach the skills you need, ranked by relevance and student ratings.</p>
    </div>

    <!-- Search & Filter Bar -->
    <div class="filter-card shadow-sm mb-4">
      <div class="row g-2 align-items-center">
        
        <!-- Search Keyword -->
        <div class="col-lg-4 col-md-12">
          <label class="form-label small fw-semibold mb-1">Search Skill or Mentor Name</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0">🔍</span>
            <input type="text" class="form-control border-start-0 ps-0" id="search-input" placeholder="e.g. Python, Figma, DSA, Public Speaking...">
          </div>
        </div>

        <!-- Filter: Department -->
        <div class="col-lg-2 col-md-3 col-6">
          <label class="form-label small fw-semibold mb-1">Department</label>
          <select class="form-select" id="dept-filter">
            <option value="">All Departments</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="EE">EE</option>
            <option value="ME">ME</option>
            <option value="Civil">Civil</option>
          </select>
        </div>

        <!-- Filter: Skill Level -->
        <div class="col-lg-2 col-md-3 col-6">
          <label class="form-label small fw-semibold mb-1">Proficiency</label>
          <select class="form-select" id="level-filter">
            <option value="">All Levels</option>
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>

        <!-- Filter: Mode -->
        <div class="col-lg-2 col-md-3 col-6">
          <label class="form-label small fw-semibold mb-1">Learning Mode</label>
          <select class="form-select" id="mode-filter">
            <option value="">Any Mode</option>
            <option value="Online">Online Only</option>
            <option value="Offline">Campus Offline</option>
          </select>
        </div>

        <!-- Filter: Rating -->
        <div class="col-lg-2 col-md-3 col-6">
          <label class="form-label small fw-semibold mb-1">Minimum Rating</label>
          <select class="form-select" id="rating-filter">
            <option value="0">All Ratings</option>
            <option value="4.5">★ 4.5 & Above</option>
            <option value="4.0">★ 4.0 & Above</option>
          </select>
        </div>

      </div>

      <!-- Active Filters / Reset row -->
      <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top">
        <span class="small text-muted fw-semibold" id="results-count-label">Searching mentors...</span>
        <button class="btn btn-link btn-sm text-decoration-none text-muted p-0" id="clear-filters-btn">
          ↺ Reset All Filters
        </button>
      </div>
    </div>

    <!-- Search Results Grid -->
    <div class="row g-3" id="search-results-container">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>

  </main>

  <!-- Send Learning Request Modal (Module 6) -->
  <div class="modal fade" id="sendRequestModal" tabindex="-1" aria-labelledby="sendRequestModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <div>
            <h5 class="modal-title fw-bold" id="sendRequestModalLabel">Send Learning Request</h5>
            <small class="text-muted">To: <span id="modal-receiver-name" class="fw-bold text-dark"></span> (<span id="modal-receiver-dept"></span>)</small>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        
        <form id="modal-request-form">
          <input type="hidden" id="modal-provider-id" name="providerId">
          <div class="modal-body">
            
            <div class="mb-3">
              <label class="form-label small fw-semibold">Target Skill</label>
              <input type="text" class="form-control bg-light" id="modal-skill-name" name="skillName" readonly>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Preferred Learning Mode <span class="text-danger">*</span></label>
              <select class="form-select" name="preferredMode" required>
                <option value="Online">Online (Google Meet / Zoom)</option>
                <option value="Offline">Offline (Nursing Building Library Area)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold">Short Message to Mentor <span class="text-danger">*</span></label>
              <textarea class="form-control" name="message" rows="3" placeholder="Tell them what specific topics you want to learn, your current familiarity, and when you are free..." required></textarea>
              <div class="form-text small">The mentor will receive this request and can accept it to start chatting.</div>
            </div>

          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm px-3">🚀 Send Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
