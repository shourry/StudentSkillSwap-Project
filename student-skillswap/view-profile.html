<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Profile | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    <div id="profile-container">
      <div class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>
    </div>
  </main>

  <!-- Send Request Modal -->
  <div class="modal fade" id="profileSendRequestModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Send Learning Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="profile-request-form">
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-semibold">Choose Skill to Learn <span class="text-danger">*</span></label>
              <select class="form-select" id="modal-select-skill" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Preferred Mode</label>
              <select class="form-select" id="modal-select-mode">
                <option value="Online">Online (Google Meet / Zoom)</option>
                <option value="Offline">Offline (Nursing Building Library Area)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Message</label>
              <textarea class="form-control" id="modal-request-msg" rows="3" placeholder="Tell the mentor what you'd like to learn..." required></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary btn-sm">Send Request</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let viewedUser = null;
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      currentUser = await Auth.getCurrentUser();
      await Auth.initNavbar();
      Auth.initFooter();

      const urlParams = new URLSearchParams(window.location.search);
      let uid = urlParams.get("uid");

      if (!uid && currentUser) {
        uid = currentUser.uid;
      }

      if (!uid) {
        window.location.href = "search.html";
        return;
      }

      viewedUser = await DB.get("users", "uid", uid);
      if (!viewedUser) {
        document.getElementById("profile-container").innerHTML = `
          <div class="card p-5 text-center text-muted">
            <h4>Student Not Found</h4>
            <p>The student profile you are looking for does not exist.</p>
            <a href="search.html" class="btn btn-primary btn-sm">Back to Search</a>
          </div>
        `;
        return;
      }

      await renderProfilePage(viewedUser);
    });

    async function renderProfilePage(user) {
      const isSelf = currentUser && currentUser.uid === user.uid;

      // Load user's skills
      const allSkills = await DB.query("skills", (s) => s.userId === user.uid);
      const teachSkills = allSkills.filter((s) => s.skillType === "teach");
      const learnSkills = allSkills.filter((s) => s.skillType === "learn");

      // Load reviews
      const reviews = await DB.query("ratings", (r) => r.ratedUserId === user.uid);

      const container = document.getElementById("profile-container");
      container.innerHTML = `
        <div class="row g-4">
          
          <!-- Left Column: User Card -->
          <div class="col-lg-4 col-md-5">
            <div class="card p-4 border-0 shadow-sm text-center">
              <div class="mb-3 mx-auto">
                ${
                  user.profilePhoto
                    ? `<img src="${user.profilePhoto}" alt="${user.name}" class="rounded-circle shadow-sm" style="width: 110px; height: 110px; object-fit: cover; border: 3px solid var(--bist-blue);">`
                    : `<div class="avatar avatar-xl">${user.name[0]}</div>`
                }
              </div>

              <h4 class="fw-bold mb-0 text-dark">${SkillSwapUtils.escapeHtml(user.name)}</h4>
              <p class="text-muted small mb-1">${user.department} Department · ${user.year} (${user.semester})</p>
              <div class="small text-secondary mb-2"><code>${user.enrollment || "BIST Student"}</code></div>

              <div class="my-2">
                ${SkillSwapUtils.renderStars(user.averageRating, user.totalRatings)}
              </div>

              <div class="bg-light p-3 rounded text-start small text-muted my-3">
                <div class="mb-1">⏱️ <strong>Availability:</strong> ${SkillSwapUtils.escapeHtml(user.availability || "Flexible")}</div>
                <div>📍 <strong>Learning Mode:</strong> ${user.preferredMode || "Both"}</div>
              </div>

              <div class="d-grid gap-2">
                ${
                  isSelf
                    ? `<a href="profile.html" class="btn btn-primary btn-sm">✏️ Edit My Profile</a>`
                    : currentUser
                    ? `<button class="btn btn-primary btn-sm" onclick="openProfileRequestModal()">🚀 Send Learning Request</button>`
                    : `<a href="login.html" class="btn btn-primary btn-sm">Login to Send Request</a>`
                }
                <a href="search.html" class="btn btn-outline-secondary btn-sm">← Back to Search</a>
              </div>
            </div>

            <!-- About / Bio Card -->
            <div class="card p-4 border-0 shadow-sm mt-4">
              <h6 class="fw-bold text-dark mb-2">About</h6>
              <p class="small text-secondary mb-0">${SkillSwapUtils.escapeHtml(user.bio || "No bio added yet.")}</p>
            </div>
          </div>

          <!-- Right Column: Skills & Reviews -->
          <div class="col-lg-8 col-md-7">
            
            <!-- Can Teach -->
            <div class="card p-4 border-0 shadow-sm mb-4">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold text-primary mb-0">🎓 Skills ${user.name.split(" ")[0]} Can Teach</h5>
                <span class="badge bg-primary-subtle text-primary">${teachSkills.length} Listed</span>
              </div>

              ${
                teachSkills.length === 0
                  ? `<p class="text-muted small mb-0">No teaching skills listed yet.</p>`
                  : teachSkills
                      .map(
                        (s) => `
                    <div class="p-3 border rounded mb-2 bg-light">
                      <div class="d-flex justify-content-between align-items-center mb-1">
                        <strong class="text-dark fs-6">${SkillSwapUtils.escapeHtml(s.skillName)}</strong>
                        ${SkillSwapUtils.renderSkillLevel(s.skillLevel)}
                      </div>
                      <p class="small text-muted mb-0">${SkillSwapUtils.escapeHtml(s.description || "Offers peer mentoring and practice.")}</p>
                    </div>
                  `
                      )
                      .join("")
              }
            </div>

            <!-- Wants to Learn -->
            <div class="card p-4 border-0 shadow-sm mb-4">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold text-warning-emphasis mb-0">📖 Skills ${user.name.split(" ")[0]} Wants to Learn</h5>
                <span class="badge bg-warning-subtle text-warning-emphasis">${learnSkills.length} Listed</span>
              </div>

              ${
                learnSkills.length === 0
                  ? `<p class="text-muted small mb-0">No learning interests listed.</p>`
                  : learnSkills
                      .map(
                        (s) => `
                    <div class="p-2 border rounded mb-2 bg-white d-flex justify-content-between align-items-center">
                      <span class="fw-semibold text-dark small">${SkillSwapUtils.escapeHtml(s.skillName)}</span>
                      ${SkillSwapUtils.renderSkillLevel(s.skillLevel)}
                    </div>
                  `
                      )
                      .join("")
              }
            </div>

            <!-- Peer Reviews & Feedback Received -->
            <div class="card p-4 border-0 shadow-sm">
              <div class="d-flex align-items-center justify-content-between mb-3">
                <h5 class="fw-bold text-dark mb-0">⭐ Student Reviews (${reviews.length})</h5>
                <div>${SkillSwapUtils.renderStars(user.averageRating)}</div>
              </div>

              ${
                reviews.length === 0
                  ? `<p class="text-muted small mb-0">No session reviews received yet.</p>`
                  : reviews
                      .map(
                        (r) => `
                    <div class="border-bottom py-3">
                      <div class="d-flex justify-content-between align-items-center mb-1">
                        <div>
                          <strong class="text-dark small">${SkillSwapUtils.escapeHtml(r.raterName)}</strong>
                          <span class="badge bg-light text-muted border ms-1 small">${SkillSwapUtils.escapeHtml(r.skillName)}</span>
                        </div>
                        <span class="text-warning small">${"★".repeat(r.stars)}${"☆".repeat(5 - r.stars)}</span>
                      </div>
                      <p class="small text-secondary mb-1">"${SkillSwapUtils.escapeHtml(r.review || "Great learning session!")}"</p>
                      <small class="text-muted" style="font-size: 0.72rem;">${SkillSwapUtils.formatDate(r.createdAt)}</small>
                    </div>
                  `
                      )
                      .join("")
              }
            </div>

          </div>

        </div>
      `;

      // Setup Request Modal Options
      const selectSkill = document.getElementById("modal-select-skill");
      if (selectSkill) {
        if (teachSkills.length > 0) {
          selectSkill.innerHTML = teachSkills
            .map((s) => `<option value="${SkillSwapUtils.escapeHtml(s.skillName)}">${SkillSwapUtils.escapeHtml(s.skillName)} (${s.skillLevel})</option>`)
            .join("");
        } else {
          selectSkill.innerHTML = `<option value="">General Mentorship</option>`;
        }
      }
    }

    window.openProfileRequestModal = () => {
      const modalEl = document.getElementById("profileSendRequestModal");
      const modal = new bootstrap.Modal(modalEl);
      modal.show();
    };

    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("profile-request-form");
      if (form) {
        form.addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!currentUser) {
            window.location.href = "login.html";
            return;
          }

          const skillName = document.getElementById("modal-select-skill").value;
          const preferredMode = document.getElementById("modal-select-mode").value;
          const message = document.getElementById("modal-request-msg").value.trim();

          await DB.add(
            "requests",
            {
              senderId: currentUser.uid,
              senderName: currentUser.name,
              receiverId: viewedUser.uid,
              receiverName: viewedUser.name,
              skillName,
              preferredMode,
              message,
              status: "pending"
            },
            "requestId"
          );

          SkillSwapUtils.showToast("Learning request sent to " + viewedUser.name + "!", "success");

          const modalEl = document.getElementById("profileSendRequestModal");
          const modal = bootstrap.Modal.getInstance(modalEl);
          if (modal) modal.hide();

          form.reset();
        });
      }
    });
  </script>
</body>
</html>
