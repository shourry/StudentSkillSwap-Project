<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    <div class="row justify-content-center">
      
      <!-- Profile Preview Card (Left) -->
      <div class="col-lg-4 col-md-5 mb-4">
        <div class="card p-4 border-0 shadow-sm text-center">
          <div class="mb-3 mx-auto" id="avatar-preview-container">
            <!-- Rendered by profile.js -->
          </div>

          <h4 class="fw-bold mb-0" id="preview-name">Student Profile</h4>
          <div id="profile-rating-display" class="my-2"></div>

          <div id="profile-skills-summary"></div>

          <hr class="my-3">

          <div class="d-grid gap-2">
            <a href="view-profile.html" id="view-public-btn" class="btn btn-outline-primary btn-sm">
              👁️ View My Public Profile
            </a>
            <a href="skills.html" class="btn btn-light btn-sm border">
              ⚡ Manage Skills
            </a>
          </div>

          <!-- Avatar Preset Selector -->
          <div class="mt-4 pt-3 border-top text-start">
            <label class="form-label small fw-semibold text-muted">Or Pick an Avatar Preset:</label>
            <div class="d-flex gap-2 justify-content-center">
              <button type="button" class="btn btn-light p-1 border avatar-preset-btn" data-url="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=50&auto=format&fit=crop&q=80" class="rounded-circle" width="36" height="36">
              </button>
              <button type="button" class="btn btn-light p-1 border avatar-preset-btn" data-url="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&auto=format&fit=crop&q=80">
                <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=50&auto=format&fit=crop&q=80" class="rounded-circle" width="36" height="36">
              </button>
              <button type="button" class="btn btn-light p-1 border avatar-preset-btn" data-url="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&auto=format&fit=crop&q=80">
                <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=50&auto=format&fit=crop&q=80" class="rounded-circle" width="36" height="36">
              </button>
              <button type="button" class="btn btn-light p-1 border avatar-preset-btn" data-url="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=50&auto=format&fit=crop&q=80" class="rounded-circle" width="36" height="36">
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- Profile Edit Form (Right) -->
      <div class="col-lg-8 col-md-7">
        <div class="card p-4 p-md-5 border-0 shadow-sm">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Edit Student Profile</h4>
            <span class="badge bg-light text-dark border">BIST Bhopal</span>
          </div>
          <p class="text-muted small mb-4">Keep your academic and contact details up-to-date so peers can connect easily.</p>

          <form id="profile-form">
            <div class="row g-3">
              
              <!-- Name & Email -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Email (Read Only)</label>
                <input type="email" class="form-control bg-light" name="email" readonly>
              </div>

              <!-- Enrollment & Department -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Enrollment Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="enrollment" style="text-transform: uppercase;" required>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Department <span class="text-danger">*</span></label>
                <select class="form-select" name="department" required>
                  <option value="CSE">Computer Science (CSE)</option>
                  <option value="IT">Information Technology (IT)</option>
                  <option value="ECE">Electronics & Comm (ECE)</option>
                  <option value="EE">Electrical Engineering (EE)</option>
                  <option value="ME">Mechanical Engineering (ME)</option>
                  <option value="Civil">Civil Engineering (Civil)</option>
                </select>
              </div>

              <!-- Year & Semester -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Year <span class="text-danger">*</span></label>
                <select class="form-select" name="year" required>
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year">3rd Year</option>
                  <option value="4th Year">4th Year</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Semester <span class="text-danger">*</span></label>
                <select class="form-select" name="semester" required>
                  <option value="1st Sem">1st Semester</option>
                  <option value="2nd Sem">2nd Semester</option>
                  <option value="3rd Sem">3rd Semester</option>
                  <option value="4th Sem">4th Semester</option>
                  <option value="5th Sem">5th Semester</option>
                  <option value="6th Sem">6th Semester</option>
                  <option value="7th Sem">7th Semester</option>
                  <option value="8th Sem">8th Semester</option>
                </select>
              </div>

              <!-- Photo Upload & URL -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Upload Photo (from Computer)</label>
                <input type="file" class="form-control" id="photo-file-input" accept="image/*">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Or Image URL</label>
                <input type="url" class="form-control" id="photo-url-input" placeholder="https://example.com/photo.jpg">
              </div>

              <!-- Availability & Mode -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Availability Hours</label>
                <input type="text" class="form-control" name="availability" placeholder="e.g. Mon-Fri 5 PM - 8 PM, Weekends">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Preferred Learning Mode</label>
                <select class="form-select" name="preferredMode">
                  <option value="Both">Both (Online & Campus Offline)</option>
                  <option value="Online">Online Only (Google Meet)</option>
                  <option value="Offline">Offline Only (Nursing Building Library Area)</option>
                </select>
              </div>

              <!-- Bio -->
              <div class="col-12">
                <label class="form-label small fw-semibold">About / Bio</label>
                <textarea class="form-control" name="bio" rows="3" placeholder="Tell other students about your interests, skills, and learning goals..."></textarea>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                  💾 Save Profile Changes
                </button>
              </div>
            </div>
          </form>

        </div>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/profile.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const user = await Auth.getCurrentUser();
      if (user) {
        document.getElementById("view-public-btn").href = `view-profile.html?uid=${user.uid}`;
        document.getElementById("preview-name").textContent = user.name;
      }
    });
  </script>
</body>
</html>
