<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rate Session | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8">
        
        <div class="card border-0 shadow-sm p-4 p-md-5" id="feedback-form-container">
          
          <div class="text-center mb-4">
            <div id="peer-avatar-container" class="mb-3 mx-auto"></div>
            <h3 class="fw-bold mb-1">Rate Your Learning Session</h3>
            <p class="text-muted small mb-0">Help build a trustworthy peer learning community at BIST Bhopal.</p>
          </div>

          <!-- Session Summary Card -->
          <div class="bg-light p-3 rounded mb-4 border text-center">
            <div class="small text-muted mb-1" id="peer-role">Peer Mentor</div>
            <h5 class="fw-bold text-dark mb-1" id="peer-name">Student Name</h5>
            <div class="badge bg-primary px-3 py-1 mb-2 fs-6" id="session-skill">Skill Name</div>
            <div class="small text-muted" id="session-date-time">Date & Time</div>
          </div>

          <form id="feedback-form">
            <!-- 5-Star Rating Selector -->
            <div class="mb-4 text-center">
              <label class="form-label fw-bold d-block mb-2">How was your session experience?</label>
              
              <div class="star-rating-input justify-content-center">
                <input type="radio" id="star5" name="stars" value="5" checked>
                <label for="star5" title="5 Stars - Outstanding!">★</label>
                
                <input type="radio" id="star4" name="stars" value="4">
                <label for="star4" title="4 Stars - Very Good">★</label>
                
                <input type="radio" id="star3" name="stars" value="3">
                <label for="star3" title="3 Stars - Good">★</label>
                
                <input type="radio" id="star2" name="stars" value="2">
                <label for="star2" title="2 Stars - Fair">★</label>
                
                <input type="radio" id="star1" name="stars" value="1">
                <label for="star1" title="1 Star - Poor">★</label>
              </div>
              <small class="text-muted">Click a star to rate from 1 to 5</small>
            </div>

            <!-- Review Textarea -->
            <div class="mb-4">
              <label class="form-label small fw-semibold">Written Feedback / Review (Optional)</label>
              <textarea class="form-control" name="review" rows="4" placeholder="Share what went well, how patient they were, and what topics you covered together..."></textarea>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary py-2 fw-semibold">
                ⭐ Submit Rating & Feedback
              </button>
              <a href="schedule.html" class="btn btn-outline-secondary btn-sm">
                Cancel
              </a>
            </div>
          </form>

        </div>

      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/feedback.js"></script>
</body>
</html>
