<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">
        <div class="card border-0 shadow-md p-4 p-md-5">
          
          <div class="text-center mb-4">
            <div class="avatar avatar-lg mx-auto mb-2" style="background: linear-gradient(135deg, var(--bist-teal), var(--bist-blue));">
              🎓
            </div>
            <h3 class="fw-bold mb-1">Create Student Account</h3>
            <p class="text-muted small">Join BIST Bhopal's Peer-to-Peer Skill Marketplace</p>
          </div>

          <form id="register-form" novalidate>
            <div class="row g-3">
              
              <!-- Full Name -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Full Name <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="name" placeholder="e.g. Shoury Thakur" required>
              </div>

              <!-- College Email -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">College / Personal Email <span class="text-danger">*</span></label>
                <input type="email" class="form-control" name="email" placeholder="e.g. shoury@bist.ac.in" required>
                <div class="form-text" style="font-size: 0.75rem;">Preferably your @bist.ac.in student mail</div>
              </div>

              <!-- Enrollment Number -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">BIST Enrollment Number <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="enrollment" placeholder="e.g. 0103CS221088" style="text-transform: uppercase;" required>
              </div>

              <!-- Department -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Engineering Department <span class="text-danger">*</span></label>
                <select class="form-select" name="department" required>
                  <option value="CSE" selected>Computer Science (CSE)</option>
                  <option value="IT">Information Technology (IT)</option>
                  <option value="ECE">Electronics & Comm (ECE)</option>
                  <option value="EE">Electrical Engineering (EE)</option>
                  <option value="ME">Mechanical Engineering (ME)</option>
                  <option value="Civil">Civil Engineering (Civil)</option>
                </select>
              </div>

              <!-- Year & Semester -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Current Year <span class="text-danger">*</span></label>
                <select class="form-select" name="year" required>
                  <option value="1st Year">1st Year</option>
                  <option value="2nd Year">2nd Year</option>
                  <option value="3rd Year" selected>3rd Year</option>
                  <option value="4th Year">4th Year</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-semibold">Current Semester <span class="text-danger">*</span></label>
                <select class="form-select" name="semester" required>
                  <option value="1st Sem">1st Semester</option>
                  <option value="2nd Sem">2nd Semester</option>
                  <option value="3rd Sem">3rd Semester</option>
                  <option value="4th Sem">4th Semester</option>
                  <option value="5th Sem" selected>5th Semester</option>
                  <option value="6th Sem">6th Semester</option>
                  <option value="7th Sem">7th Semester</option>
                  <option value="8th Sem">8th Semester</option>
                </select>
              </div>

              <!-- Password -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="password" minlength="6" placeholder="At least 6 characters" required>
              </div>

              <!-- Confirm Password -->
              <div class="col-md-6">
                <label class="form-label small fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                <input type="password" class="form-control" name="confirmPassword" minlength="6" placeholder="Repeat password" required>
              </div>

              <!-- Preferred Mode & Bio -->
              <div class="col-12">
                <label class="form-label small fw-semibold">Preferred Learning Mode</label>
                <select class="form-select" name="preferredMode">
                  <option value="Both" selected>Both (Online & Campus Offline)</option>
                  <option value="Online">Online Only (Google Meet / Zoom)</option>
                  <option value="Offline">Offline Only (Nursing Building Library Area)</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label small fw-semibold">Short Bio / What you love doing</label>
                <textarea class="form-control" name="bio" rows="2" placeholder="e.g. CSE 3rd year student into Web Development, looking to learn Machine Learning..."></textarea>
              </div>

              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold fs-6">
                  Complete Registration & Go to Dashboard
                </button>
              </div>
            </div>
          </form>

          <div class="text-center mt-4 pt-2 border-top">
            <p class="text-muted small mb-0">
              Already have an account? <a href="login.html" class="fw-bold text-primary">Log In here</a>
            </p>
          </div>

        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // If already logged in, redirect to dashboard
      const user = await Auth.getCurrentUser();
      if (user) {
        window.location.href = "dashboard.html";
        return;
      }

      await Auth.initNavbar("register");
      Auth.initFooter();

      const form = document.getElementById("register-form");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (form.password.value !== form.confirmPassword.value) {
          SkillSwapUtils.showToast("Passwords do not match.", "danger");
          return;
        }

        try {
          const newUser = await Auth.register({
            name: form.name.value,
            email: form.email.value,
            enrollment: form.enrollment.value,
            department: form.department.value,
            year: form.year.value,
            semester: form.semester.value,
            password: form.password.value,
            preferredMode: form.preferredMode.value,
            bio: form.bio.value
          });

          SkillSwapUtils.showToast("Account created successfully! Welcome to SkillSwap.", "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 800);
        } catch (err) {
          SkillSwapUtils.showToast(err.message, "danger");
        }
      });
    });
  </script>
</body>
</html>
