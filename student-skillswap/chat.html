<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Chat | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h4 class="fw-bold mb-0">💬 Peer Messaging</h4>
        <small class="text-muted">Coordinate learning topics and session logistics with matched students.</small>
      </div>
      <a href="requests.html" class="btn btn-outline-secondary btn-sm">
        📬 View All Requests
      </a>
    </div>

    <!-- Chat Container Box -->
    <div class="chat-container">
      
      <!-- Left Sidebar: Conversations List -->
      <div class="chat-sidebar">
        <div class="chat-sidebar-header">
          <strong class="small text-uppercase text-muted fw-bold">Active Matches</strong>
        </div>
        <div class="chat-sidebar-list" id="chat-sidebar-list">
          <div class="p-4 text-center">
            <div class="spinner-border spinner-border-sm text-primary"></div>
          </div>
        </div>
      </div>

      <!-- Right Main: Active Chat Stream -->
      <div class="chat-main" id="chat-main-panel">
        
        <!-- Header -->
        <div class="chat-header" id="chat-active-header">
          <div class="text-muted small">Select a conversation from the left to start chatting</div>
        </div>

        <!-- Messages Stream -->
        <div class="chat-messages" id="chat-messages-container">
          <div class="m-auto text-center text-muted">
            <div class="spinner-border text-primary"></div>
          </div>
        </div>

        <!-- Input Bar -->
        <div class="chat-input-bar">
          <form id="chat-form" class="d-flex gap-2">
            <input type="text" class="form-control" id="chat-input-text" placeholder="Type a message to your peer mentor..." autocomplete="off" required>
            <button type="submit" class="btn btn-primary px-4 fw-semibold">
              Send
            </button>
          </form>
        </div>

      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
