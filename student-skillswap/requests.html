<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learning Requests | Student SkillSwap - BIST Bhopal</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-placeholder"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h2 class="fw-bold mb-1">📬 Learning Requests</h2>
        <p class="text-muted small mb-0">Track all incoming requests to learn your skills, and check the status of requests you've sent.</p>
      </div>
      <a href="search.html" class="btn btn-primary btn-sm">
        🔍 Find More Mentors
      </a>
    </div>

    <!-- Requests Tabs -->
    <ul class="nav nav-pills mb-4 bg-white p-2 rounded shadow-sm border" id="requestsTab" role="tablist">
      <li class="nav-item flex-fill text-center" role="presentation">
        <button class="nav-link active w-100 fw-semibold" id="received-tab" data-bs-toggle="pill" data-bs-target="#received-pane" type="button" role="tab">
          📥 Received Requests <span class="badge bg-primary ms-1" id="received-badge">0</span>
        </button>
      </li>
      <li class="nav-item flex-fill text-center" role="presentation">
        <button class="nav-link w-100 fw-semibold" id="sent-tab" data-bs-toggle="pill" data-bs-target="#sent-pane" type="button" role="tab">
          📤 Sent Requests <span class="badge bg-secondary ms-1" id="sent-badge">0</span>
        </button>
      </li>
    </ul>

    <!-- Tab Contents -->
    <div class="tab-content" id="requestsTabContent">
      <!-- Received Requests Tab Pane -->
      <div class="tab-pane fade show active" id="received-pane" role="tabpanel">
        <div id="received-requests-list">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>
      </div>

      <!-- Sent Requests Tab Pane -->
      <div class="tab-pane fade" id="sent-pane" role="tabpanel">
        <div id="sent-requests-list">
          <div class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <div id="footer-placeholder"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/requests.js"></script>
</body>
</html>
